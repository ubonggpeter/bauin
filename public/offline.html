<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline · BAUIN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0E4A3D 0%, #1A6659 50%, #0E4A3D 100%);
      background-size: 400% 400%;
      animation: gradShift 8s ease infinite;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    @keyframes gradShift {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .card { text-align: center; max-width: 22rem; width: 100%; }

    /* Animated rings + logo */
    .logo-wrap {
      position: relative;
      width: 96px; height: 96px;
      margin: 0 auto 2rem;
    }
    .ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(240,180,41,.3);
      animation: ringPulse 2.4s ease-in-out infinite;
    }
    .ring:nth-child(2) { animation-delay: .6s; inset: -12px; border-color: rgba(240,180,41,.2); }
    .ring:nth-child(3) { animation-delay: 1.2s; inset: -24px; border-color: rgba(240,180,41,.1); }
    @keyframes ringPulse {
      0%,100% { opacity: .4; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.04); }
    }
    .logo-inner {
      position: absolute; inset: 0;
      border-radius: 22px;
      background: linear-gradient(135deg, #F0B429, #d4981e);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 2.5rem; color: #1A1A2E;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%,100% { transform: scale(1); box-shadow: 0 8px 32px rgba(0,0,0,.3); }
      50%      { transform: scale(1.05); box-shadow: 0 14px 44px rgba(0,0,0,.4); }
    }

    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: .5rem; }
    p  { font-size: .9rem; color: rgba(255,255,255,.7); line-height: 1.65; margin-bottom: 1.75rem; }

    /* Waiting dots */
    .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 2rem; }
    .dot  {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,.35);
      animation: dotBounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes dotBounce {
      0%,80%,100% { transform: scale(.8); opacity: .35; }
      40%          { transform: scale(1.25); opacity: 1; }
    }

    button {
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: white;
      border: 1.5px solid rgba(255,255,255,.25);
      border-radius: .875rem;
      padding: .875rem 2rem;
      font-size: .925rem; font-weight: 700;
      cursor: pointer; width: 100%;
      transition: background .2s, border-color .2s;
      margin-bottom: .75rem;
    }
    button:hover  { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.4); }
    button:active { background: rgba(255,255,255,.3); }

    .status { font-size: .75rem; color: rgba(255,255,255,.4); min-height: 1.4em; transition: color .3s; }
    .status.online { color: #86efac; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="logo-inner">B</div>
    </div>

    <h1>You're offline</h1>
    <p>
      BAUIN needs an internet connection for quizzes, stories and
      competitions. Connect to Wi-Fi or mobile data to continue.
    </p>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <button onclick="window.location.reload()">Try Again</button>
    <p class="status" id="status">Waiting for connection…</p>
  </div>

  <script>
    function updateStatus() {
      var el = document.getElementById('status');
      if (navigator.onLine) {
        el.textContent  = 'Connection restored — taking you back…';
        el.className    = 'status online';
        setTimeout(function() { window.location.reload(); }, 900);
      } else {
        el.textContent = 'Still offline. Waiting…';
        el.className   = 'status';
      }
    }
    window.addEventListener('online',  updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
