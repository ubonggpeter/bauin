<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline · BAUIN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F5F7F6;
      color: #1A1A2E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 24rem;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .logo {
      width: 56px; height: 56px;
      background: #1A6659;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
      font-weight: 900; font-size: 1.5rem; color: white;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .5rem; }
    p  { font-size: .875rem; color: #6B7280; line-height: 1.6; margin-bottom: 1.5rem; }
    .wave {
      font-size: 3rem; margin-bottom: 1rem; display: block;
      animation: wave 2s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25%       { transform: rotate(-15deg); }
      75%       { transform: rotate(15deg); }
    }
    button {
      background: #1A6659; color: white;
      border: none; border-radius: .75rem;
      padding: .75rem 1.5rem;
      font-size: .875rem; font-weight: 700;
      cursor: pointer; width: 100%;
      transition: background .2s;
    }
    button:hover { background: #0E4A3D; }
    .status { font-size: .75rem; color: #9CA3AF; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <span class="wave">📵</span>
    <div class="logo">B</div>
    <h1>You're offline</h1>
    <p>
      BAUIN needs an internet connection for quizzes, stories and competitions.
      Connect to Wi-Fi or mobile data to continue.
    </p>
    <button onclick="window.location.reload()">Try Again</button>
    <p class="status" id="status">Checking connection…</p>
  </div>
  <script>
    function updateStatus() {
      document.getElementById('status').textContent =
        navigator.onLine ? 'Connection restored — reloading…' : 'Still offline';
      if (navigator.onLine) setTimeout(() => window.location.reload(), 800);
    }
    window.addEventListener('online',  updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
